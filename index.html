<h1>Ralden OS updates</h1>
<p>This is where computers running Ralden OS find updates to Ralden's own
parts. They look here by themselves; there is nothing to download from
this page.</p>
<p>Everything here is signed with Ralden's key
(<code>ralden-archive-keyring.gpg</code>), and a Ralden computer takes
nothing that is not.</p>
